name: Deploy to Staging
on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Build and push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Build and push backend
          docker build -t $ECR_REGISTRY/crewai-backend:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/crewai-backend:$IMAGE_TAG
          
          # Build and push frontend
          docker build -t $ECR_REGISTRY/crewai-frontend:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/crewai-frontend:$IMAGE_TAG
          
      - name: Update ECS service
        run: |
          aws ecs update-service --cluster staging-cluster --service backend-service --force-new-deployment
          aws ecs update-service --cluster staging-cluster --service frontend-service --force-new-deployment
