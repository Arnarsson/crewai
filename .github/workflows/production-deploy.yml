name: Deploy to Production
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3
      
      - name: Backup Production Database
        run: ./scripts/backup.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Build and push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Build and push backend
          docker build -t $ECR_REGISTRY/crewai-backend:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/crewai-backend:$IMAGE_TAG
          
          # Build and push frontend
          docker build -t $ECR_REGISTRY/crewai-frontend:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/crewai-frontend:$IMAGE_TAG
          
      - name: Update ECS services
        run: |
          aws ecs update-service --cluster production-cluster --service backend-service --force-new-deployment
          aws ecs update-service --cluster production-cluster --service frontend-service --force-new-deployment
          
      - name: Health Check
        run: ./scripts/health-check.sh
        env:
          API_URL: ${{ secrets.PROD_API_URL }}
